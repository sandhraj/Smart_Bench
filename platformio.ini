[platformio]
default_envs = esp32dev, demo

[base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = fastled/FastLED@3.9.20
build_flags =
    -DNUM_LEDS=112
    -DLED_PIN=16
    -DCAP_MA=1000

; LED bring-up sketch: proves supply and data path.
[env:esp32dev]
extends = base
build_src_filter = +<*> -<demo_main.cpp>

; Style demo with synthetic audio, to judge the display styles on the real strip.
[env:demo]
extends = base
build_src_filter = +<*> -<main.cpp>

; Host tests: pure logic in lib/vu_core, no Arduino, runs on a PC / in CI.
[env:native]
platform = native
test_framework = unity
