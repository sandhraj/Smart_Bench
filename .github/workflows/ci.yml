name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.16
      - name: Host unit tests
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.16
      - name: Build firmware (bring-up and demo)
        run: pio run -e esp32dev -e demo
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/demo/firmware.bin
